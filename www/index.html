<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cash Flow Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#15251E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cash Flow">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#F1F4F1; --surface:#FFFFFF; --ink:#15251E; --muted:#5F6F67; --line:#DDE5DF;
  --in:#1B8556; --out:#C4423A; --accent:#15251E; --accent-ink:#FFFFFF; --soft:#EAF1EC;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101915; --surface:#18241E; --ink:#EAF2EC; --muted:#9BAEA3; --line:#2A3A32;
    --in:#4CCB92; --out:#F27B72; --accent:#EAF2EC; --accent-ink:#101915; --soft:#1F2E26;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101915; --surface:#18241E; --ink:#EAF2EC; --muted:#9BAEA3; --line:#2A3A32;
  --in:#4CCB92; --out:#F27B72; --accent:#EAF2EC; --accent-ink:#101915; --soft:#1F2E26;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{margin:0;font-size:1.45rem;font-weight:700;letter-spacing:-.01em}
h2{margin:0 0 12px;font-size:1rem;font-weight:700}
.monthpick{display:flex;align-items:center;gap:6px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0;font-size:16px;min-height:44px}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--in);outline-offset:2px}
.icon{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface)}
.monthpick input{width:auto}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media (max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}}
.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.card span{display:block;color:var(--muted);font-size:.82rem}
.card b{display:block;font-size:1.35rem;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.pos{color:var(--in)} .neg{color:var(--out)}
.cols{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:14px;margin-top:14px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.field{margin-bottom:10px}
label{display:block;font-size:.82rem;color:var(--muted);margin-bottom:3px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn{width:100%;border:0;border-radius:12px;padding:12px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:none;color:var(--muted);border:1px solid var(--line);font-weight:500;margin-top:8px}
svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--muted);margin-top:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.proj{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.proj div{background:var(--soft);border-radius:12px;padding:10px}
.proj span{display:block;font-size:.8rem;color:var(--muted)}
.proj b{font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:.9rem;margin:6px 0 0}
table{width:100%;border-collapse:collapse}
td,th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.78rem;color:var(--muted);font-weight:600}
td.amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
td small{display:block;color:var(--muted)}
.del{border:0;background:none;color:var(--muted);padding:4px 8px;border-radius:8px}
.del:hover{color:var(--out)}
.scroll{overflow-x:auto}
details{margin-top:12px}
summary{cursor:pointer;color:var(--muted)}
.empty{color:var(--muted);padding:14px 0}
.stack{display:flex;flex-direction:column;gap:14px}
.seg3{grid-template-columns:repeat(3,1fr)}
.totalrow td{font-weight:700;border-top:2px solid var(--line)}
html{-webkit-text-size-adjust:100%}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.seg button,.btn{min-height:46px}
.icon{width:44px;height:44px}
.del{min-width:44px;min-height:44px}
tr[data-day] td{padding-top:12px;padding-bottom:12px}
.fab{display:none}
@media (max-width:820px){
  .wrap{padding:12px 12px calc(88px + env(safe-area-inset-bottom,0px))}
  h1{font-size:1.25rem}
  .card{padding:12px}
  .card b{font-size:1.15rem}
  .panel{padding:14px 12px}
  .fab{display:block;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;border:0;border-radius:999px;padding:14px 22px;min-height:48px;background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Cash Flow Tracker</h1>
    <div class="monthpick">
      <button class="icon" id="prev" aria-label="Previous month">‹</button>
      <input type="month" id="month" aria-label="Month">
      <button class="icon" id="next" aria-label="Next month">›</button>
    </div>
  </header>

  <div class="cards" id="cards"></div>

  <div class="panel">
    <h2>Cash in vs cash out, last 6 months</h2>
    <div id="chart"></div>
    <div class="legend"><span><i class="dot" style="background:var(--in)"></i>Cash in</span><span><i class="dot" style="background:var(--out)"></i>Cash out</span></div>
  </div>

  <div class="cols">
    <div class="stack">
      <div class="panel">
        <h2>Key in today’s entries</h2>
        <p class="note" style="margin:-6px 0 12px">Add one entry per expense, or one entry for the day’s total. Daily, weekly and monthly totals are added up for you.</p>
        <div class="seg">
          <button id="t-in" aria-pressed="false">Cash in</button>
          <button id="t-out" aria-pressed="true">Cash out (expense)</button>
        </div>
        <div class="field"><label for="date">Date</label><input type="date" id="date"></div>
        <div class="field"><label for="cat">Category</label><select id="cat"></select></div>
        <div class="field"><label for="note">Note (optional)</label><input id="note" placeholder="e.g. Cone supplier"></div>
        <div class="field"><label for="amt">Amount</label><input id="amt" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00"></div>
        <button class="btn" id="add">Add entry</button>
        <p class="note" id="msg" role="status"></p>
        <details>
          <summary>Settings</summary>
          <div class="field" style="margin-top:10px"><label for="open">Opening balance (before your first entry)</label><input id="open" type="number" step="0.01" inputmode="decimal"></div>
          <div class="field"><label for="sym">Currency symbol</label><input id="sym" maxlength="4"></div>
          <button class="btn ghost" id="sample">Load sample data</button>
          <button class="btn ghost" id="csv">Export entries (CSV)</button>
          <button class="btn ghost" id="backup">Save a backup file</button>
          <button class="btn ghost" id="restore">Restore from backup</button>
          <input type="file" id="file" accept=".json,application/json" hidden>
          <button class="btn ghost" id="wipe">Delete all data</button>
        </details>
      </div>
      <div class="panel">
        <h2>Next 3 months</h2>
        <div id="proj"></div>
      </div>
    </div>

    <div class="panel">
      <div class="seg seg3" role="group" aria-label="View">
        <button id="v-day" aria-pressed="true">Daily</button>
        <button id="v-week" aria-pressed="false">Weekly</button>
        <button id="v-month" aria-pressed="false">Monthly</button>
      </div>
      <div class="field" id="dayrow"><label for="day">Day</label><input type="date" id="day"></div>
      <h2 id="listtitle">Entries</h2>
      <div class="scroll" id="list"></div>
    </div>
  </div>
</div>

<button class="fab" id="fab">+ Add entry</button>

<script>
const CATS={in:["Sales","Other income","Owner capital","Loan"],out:["Supplies","Rent","Salaries","Utilities","Equipment","Marketing","Other"]};
let S={opening:0,symbol:"₱",tx:[]};
let type="out", wipeArmed=false, view="day", day="";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function load(){try{const d=JSON.parse(localStorage.getItem("cf-data")||"null");if(d)S=Object.assign(S,d)}catch(e){}}
function save(){try{localStorage.setItem("cf-data",JSON.stringify(S))}catch(e){}}
const fmt=n=>(n<0?"−":"")+S.symbol+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,"0");
const keyOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
const shift=(k,n)=>{const[y,m]=k.split("-").map(Number);return keyOf(new Date(y,m-1+n,1))};
const short=k=>{const[y,m]=k.split("-").map(Number);return new Date(y,m-1,1).toLocaleString("en",{month:"short"})+" ’"+String(y).slice(2)};
const long=k=>{const[y,m]=k.split("-").map(Number);return new Date(y,m-1,1).toLocaleString("en",{month:"long",year:"numeric"})};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};

function totals(){
  const t={};
  for(const x of S.tx){const k=x.date.slice(0,7);t[k]=t[k]||{in:0,out:0};t[k][x.type]+=x.amt}
  return t;
}
function setCats(){$("cat").innerHTML=CATS[type].map(c=>`<option>${c}</option>`).join("")}

function render(){
  const m=$("month").value||keyOf(new Date());
  const t=totals(), cur=t[m]||{in:0,out:0};
  let before=Number(S.opening)||0;
  for(const k in t){if(k<m)before+=t[k].in-t[k].out}
  const net=cur.in-cur.out, end=before+net;

  $("cards").innerHTML=`
    <div class="card"><span>Opening balance</span><b>${fmt(before)}</b></div>
    <div class="card"><span>Cash in</span><b class="pos">+${fmt(cur.in)}</b></div>
    <div class="card"><span>Cash out</span><b class="neg">−${fmt(cur.out)}</b></div>
    <div class="card"><span>Closing balance (${net>=0?"+":"−"}${fmt(Math.abs(net))} net)</span><b class="${end<0?"neg":""}">${fmt(end)}</b></div>`;

  drawChart(m,t);
  drawProj(m,t,end);

  drawList(m,t);
}

const sum=(a,t)=>a.reduce((s,x)=>x.type===t?s+x.amt:s,0);
const longDay=d=>{const[y,m,dd]=d.split("-").map(Number);return new Date(y,m-1,dd).toLocaleDateString("en",{weekday:"long",month:"long",day:"numeric",year:"numeric"})};
const box=(l,v,c)=>`<div><span>${l}</span><b class="${c||""}">${v}</b></div>`;
const entryRow=x=>`<tr><td>${esc(x.cat)}${x.note?`<small>${esc(x.note)}</small>`:""}</td><td class="amt ${x.type==="in"?"pos":"neg"}">${x.type==="in"?"+":"−"}${fmt(x.amt)}</td><td><button class="del" data-id="${x.id}" aria-label="Delete entry">✕</button></td></tr>`;
const th=(t,r)=>`<th${r?' style="text-align:right"':""}>${t}</th>`;

function drawList(m,t){
  $("dayrow").style.display=view==="day"?"":"none";
  ["day","week","month"].forEach(v=>$("v-"+v).setAttribute("aria-pressed",String(v===view)));
  if(view==="day")drawDay(m);else if(view==="week")drawWeek(m);else drawMonths(t);
}

function drawDay(m){
  if(day.slice(0,7)!==m)day=m===keyOf(new Date())?today():m+"-01";
  $("day").value=day;
  const items=S.tx.filter(x=>x.date===day).sort((a,b)=>b.id-a.id);
  const o=sum(items,"out"),i=sum(items,"in");
  $("listtitle").textContent=longDay(day);
  let h=`<div class="proj">${box("Expenses",fmt(o),"neg")}${box("Cash in",fmt(i),"pos")}${box("Net",(i-o>0?"+":"")+fmt(i-o),i-o<0?"neg":"")}</div>`;
  h+=items.length?`<table><thead><tr>${th("Entry")}${th("Amount",1)}<th></th></tr></thead><tbody>${items.map(entryRow).join("")}</tbody></table>`:`<p class="empty">Nothing recorded for this day yet. Key in the day’s expenses on the left.</p>`;
  const by={};
  for(const x of S.tx){if(x.date.slice(0,7)!==m)continue;by[x.date]=by[x.date]||{in:0,out:0};by[x.date][x.type]+=x.amt}
  const days=Object.keys(by).sort().reverse();
  if(days.length)h+=`<h2 style="margin-top:18px">Daily totals in ${long(m)}</h2><p class="note" style="margin:-6px 0 8px">Tap a day to open it.</p><table><thead><tr>${th("Day")}${th("Expenses",1)}${th("Cash in",1)}</tr></thead><tbody>`+
    days.map(d=>`<tr data-day="${d}" style="cursor:pointer"><td>${d.slice(8)}${d===day?" ◂":""}</td><td class="amt neg">${fmt(by[d].out)}</td><td class="amt pos">${fmt(by[d].in)}</td></tr>`).join("")+`</tbody></table>`;
  $("list").innerHTML=h;
}

function drawWeek(m){
  const[y,mo]=m.split("-").map(Number),last=new Date(y,mo,0).getDate(),weeks=[];
  let w=null;
  for(let d=1;d<=last;d++){const dow=(new Date(y,mo-1,d).getDay()+6)%7;if(!w||dow===0){w={from:d,to:d,in:0,out:0};weeks.push(w)}w.to=d}
  for(const x of S.tx){if(x.date.slice(0,7)!==m)continue;const d=+x.date.slice(8),wk=weeks.find(q=>d>=q.from&&d<=q.to);wk[x.type]+=x.amt}
  const mon=new Date(y,mo-1,1).toLocaleString("en",{month:"short"});
  const to=weeks.reduce((s,q)=>s+q.out,0),ti=weeks.reduce((s,q)=>s+q.in,0);
  $("listtitle").textContent="Weekly totals, "+long(m);
  $("list").innerHTML=`<table><thead><tr>${th("Week (Mon–Sun)")}${th("Expenses",1)}${th("Cash in",1)}${th("Net",1)}</tr></thead><tbody>`+
    weeks.map(q=>`<tr><td>${mon} ${q.from}${q.to>q.from?" – "+q.to:""}</td><td class="amt neg">${fmt(q.out)}</td><td class="amt pos">${fmt(q.in)}</td><td class="amt">${fmt(q.in-q.out)}</td></tr>`).join("")+
    `<tr class="totalrow"><td>Month total</td><td class="amt neg">${fmt(to)}</td><td class="amt pos">${fmt(ti)}</td><td class="amt">${fmt(ti-to)}</td></tr></tbody></table><p class="note">Weeks run Monday to Sunday and are cut at the start and end of the month.</p>`;
}

function drawMonths(t){
  const keys=Object.keys(t).sort();let bal=Number(S.opening)||0;const rows=[];
  keys.forEach(k=>{bal+=t[k].in-t[k].out;rows.push({k,in:t[k].in,out:t[k].out,end:bal})});
  $("listtitle").textContent="Monthly totals";
  $("list").innerHTML=rows.length?`<table><thead><tr>${th("Month")}${th("Expenses",1)}${th("Cash in",1)}${th("Net",1)}${th("Closing",1)}</tr></thead><tbody>`+
    rows.reverse().map(r=>`<tr><td>${long(r.k)}</td><td class="amt neg">${fmt(r.out)}</td><td class="amt pos">${fmt(r.in)}</td><td class="amt">${fmt(r.in-r.out)}</td><td class="amt">${fmt(r.end)}</td></tr>`).join("")+`</tbody></table>`:`<p class="empty">No entries yet.</p>`;
}

function drawChart(m,t){
  const keys=[];for(let i=5;i>=0;i--)keys.push(shift(m,-i));
  const max=Math.max(1,...keys.map(k=>Math.max((t[k]||{in:0}).in,(t[k]||{out:0}).out)));
  const H=150,base=170;
  let s=`<svg viewBox="0 0 600 205" role="img" aria-label="Bar chart of cash in and cash out for the last six months"><line x1="0" y1="${base}" x2="600" y2="${base}" stroke="var(--line)"/>`;
  keys.forEach((k,i)=>{
    const v=t[k]||{in:0,out:0}, x=i*100, hi=v.in/max*H, ho=v.out/max*H;
    s+=`<rect x="${x+16}" y="${base-hi}" width="30" height="${hi}" rx="4" fill="var(--in)"><title>${short(k)} cash in ${fmt(v.in)}</title></rect>`;
    s+=`<rect x="${x+54}" y="${base-ho}" width="30" height="${ho}" rx="4" fill="var(--out)"><title>${short(k)} cash out ${fmt(v.out)}</title></rect>`;
    s+=`<text x="${x+50}" y="195" text-anchor="middle" font-size="13" fill="var(--muted)"${k===m?' font-weight="700"':""}>${short(k)}</text>`;
  });
  $("chart").innerHTML=s+"</svg>";
}

function drawProj(m,t,end){
  const past=Object.keys(t).filter(k=>k<=m&&(t[k].in||t[k].out)).sort().slice(-3);
  if(!past.length){$("proj").innerHTML=`<p class="note">Add a few months of entries and a projection will appear here.</p>`;return}
  const avg=past.reduce((a,k)=>a+t[k].in-t[k].out,0)/past.length;
  let bal=end,html='<div class="proj">',runOut=null;
  for(let i=1;i<=3;i++){bal+=avg;const k=shift(m,i);if(bal<0&&!runOut)runOut=k;
    html+=`<div><span>${short(k)}</span><b class="${bal<0?"neg":""}">${fmt(bal)}</b></div>`}
  html+="</div>";
  html+=`<p class="note">If the last ${past.length} month${past.length>1?"s":""} repeat (average net ${avg>=0?"+":"−"}${fmt(Math.abs(avg))} a month). ${runOut?`<b class="neg">Cash could run out in ${long(runOut)}.</b>`:"Your balance stays above zero."}</p>`;
  $("proj").innerHTML=html;
}

function setType(t){type=t;$("t-in").setAttribute("aria-pressed",t==="in");$("t-out").setAttribute("aria-pressed",t==="out");setCats()}
function msg(t){$("msg").textContent=t;setTimeout(()=>{if($("msg").textContent===t)$("msg").textContent=""},2500)}

function add(){
  const amt=parseFloat($("amt").value), date=$("date").value;
  if(!date){msg("Please choose a date.");return}
  if(!(amt>0)){msg("Enter an amount above zero.");return}
  S.tx.push({id:Date.now(),date,type,cat:$("cat").value,note:$("note").value.trim(),amt:Math.round(amt*100)/100});
  save();$("amt").value="";$("note").value="";
  $("month").value=date.slice(0,7);day=date;
  msg("Entry added.");render();
}

function sample(){
  const m=keyOf(new Date());const rows=[];
  for(let i=-3;i<=0;i++){const k=shift(m,i);
    rows.push([k+"-02","in","Sales",52000+i*3000,"Week 1 sales"],[k+"-09","in","Sales",48000+i*2500,"Week 2 sales"],
      [k+"-16","in","Sales",55000+i*3500,"Week 3 sales"],[k+"-23","in","Sales",50000+i*2000,"Week 4 sales"],
      [k+"-03","out","Rent",35000,"Stall rent"],[k+"-05","out","Supplies",42000+i*1500,"Mix, cones and cups"],
      [k+"-15","out","Salaries",30000,"Two staff"],[k+"-20","out","Utilities",9500,"Power and water"])}
  S.tx=S.tx.concat(rows.map((r,i)=>({id:Date.now()+i,date:r[0],type:r[1],cat:r[2],amt:r[3],note:r[4]})));
  S.opening=S.opening||60000;$("open").value=S.opening;save();render();
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.classList.contains("del")){S.tx=S.tx.filter(x=>String(x.id)!==b.dataset.id);save();render()}
});
document.addEventListener("click",e=>{
  const tr=e.target.closest("tr[data-day]");if(!tr)return;
  day=tr.dataset.day;$("date").value=day;render();
});
$("t-in").onclick=()=>setType("in");$("t-out").onclick=()=>setType("out");
$("add").onclick=add;
$("amt").addEventListener("keydown",e=>{if(e.key==="Enter")add()});
$("month").addEventListener("change",render);
$("prev").onclick=()=>{$("month").value=shift($("month").value,-1);render()};
$("next").onclick=()=>{$("month").value=shift($("month").value,1);render()};
$("open").addEventListener("input",()=>{S.opening=parseFloat($("open").value)||0;save();render()});
$("sym").addEventListener("input",()=>{S.symbol=$("sym").value||"";save();render()});
$("sample").onclick=sample;
$("fab").onclick=()=>{$("amt").scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>$("amt").focus(),350)};
$("v-day").onclick=()=>{view="day";render()};$("v-week").onclick=()=>{view="week";render()};$("v-month").onclick=()=>{view="month";render()};
$("day").addEventListener("change",()=>{if(!$("day").value)return;day=$("day").value;$("date").value=day;$("month").value=day.slice(0,7);render()});
$("wipe").onclick=()=>{
  if(!wipeArmed){wipeArmed=true;$("wipe").textContent="Click again to delete everything";setTimeout(()=>{wipeArmed=false;$("wipe").textContent="Delete all data"},3500);return}
  S.tx=[];S.opening=0;$("open").value=0;save();wipeArmed=false;$("wipe").textContent="Delete all data";render();
};

async function download(name,text,mime){
  const C=window.Capacitor;
  if(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.Filesystem&&C.Plugins.Share){
    try{
      const fs=C.Plugins.Filesystem;
      await fs.writeFile({path:name,data:text,directory:"CACHE",encoding:"utf8"});
      const f=await fs.getUri({path:name,directory:"CACHE"});
      await C.Plugins.Share.share({title:name,url:f.uri,dialogTitle:"Save or send "+name});
    }catch(e){if(!/cancel/i.test(String((e&&e.message)||e)))msg("Could not export on this device.")}
    return;
  }
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
$("csv").onclick=()=>{
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const rows=[["Date","Type","Category","Note","Amount"]].concat(
    S.tx.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,x.type==="in"?"Cash in":"Cash out",x.cat,x.note,x.amt]));
  download("cashflow-entries.csv","\ufeff"+rows.map(r=>r.map(q).join(",")).join("\r\n"),"text/csv");
  msg("CSV ready.");
};
$("backup").onclick=()=>{download("cashflow-backup-"+today()+".json",JSON.stringify(S),"application/json");msg("Backup ready.")};
$("restore").onclick=()=>$("file").click();
$("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);if(!d||!Array.isArray(d.tx))throw new Error("bad");
      S={opening:Number(d.opening)||0,symbol:d.symbol||"₱",
        tx:d.tx.filter(x=>x&&x.date&&(x.type==="in"||x.type==="out")&&Number(x.amt)>0)
          .map((x,i)=>({id:x.id||Date.now()+i,date:x.date,type:x.type,cat:x.cat||"Other",note:x.note||"",amt:Number(x.amt)}))};
      save();$("open").value=S.opening;$("sym").value=S.symbol;render();msg("Backup restored.");
    }catch(err){msg("That file isn’t a valid backup.")}
    e.target.value="";
  };
  r.readAsText(f);
};

// Works offline: cache the app after the first visit (only when served over http/https)
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
}

load();
$("month").value=keyOf(new Date());$("date").value=today();day=today();
$("open").value=S.opening;$("sym").value=S.symbol;
setCats();render();
</script>
